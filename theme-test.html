<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Theme interaction test</title></head>
<body>
<pre id="result">RUNNING</pre>
<iframe id="target" hidden></iframe>
<script>
const target = document.querySelector("#target");
const result = document.querySelector("#result");
localStorage.removeItem("sidequest-theme");
let step = "settings";

target.addEventListener("load", () => {
    if (step === "settings") {
        const toggle = target.contentDocument.querySelector("[data-theme-toggle]");
        toggle.click();
        step = "dashboard";
        target.src = "/pages/student-dashboard.html";
        return;
    }

    const root = target.contentDocument.documentElement;
    const storedTheme = localStorage.getItem("sidequest-theme");
    const passed = root.classList.contains("dark") && storedTheme === "dark";
    result.textContent = passed ? "PASS: dark mode persisted to Dashboard" : `FAIL: class=${root.className} stored=${storedTheme}`;
});

target.src = "/pages/student-settings.html";
</script>
</body>
</html>
