<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Account Profile | SideQuest</title>
<script>
document.documentElement.classList.add("is-loading");
try {
    const dark = window.localStorage.getItem("sidequest-theme") === "dark";
    document.documentElement.classList.toggle("dark", dark);
    document.documentElement.classList.toggle("light", !dark);
} catch {
    document.documentElement.classList.add("light");
}
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script type="module" src="../assets/js/config/student-profile.tailwind.js"></script>
<link href="../assets/css/base.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-background text-on-surface font-body-md">
<header class="h-16 px-6 md:px-10 flex items-center justify-between border-b border-border-subtle bg-surface-container-lowest sticky top-0 z-50">
<a class="student-shell-brand text-primary" href="#" data-account-home>SideQuest</a>
<div class="student-shell-actions">
<button aria-label="Notifications" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-low" type="button">
<span class="material-symbols-outlined">notifications</span>
</button>
<img alt="User profile avatar" class="student-shell-avatar border border-border-subtle">
</div>
</header>
<main class="max-w-4xl mx-auto px-5 md:px-8 py-10">
<div class="mb-8">
<p class="font-label-sm text-label-sm uppercase tracking-wider text-primary">Account</p>
<h1 class="font-display-lg text-display-lg text-on-surface mt-2">Profile and settings</h1>
<p class="text-on-surface-variant mt-2">Review your signed-in account and manage shared preferences.</p>
</div>
<div class="grid md:grid-cols-[1.4fr_1fr] gap-6">
<section class="rounded-xl border border-border-subtle bg-surface-container-lowest p-6 shadow-sm">
<div class="flex items-center gap-4 mb-6">
<div class="w-14 h-14 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[30px]">account_circle</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface" data-profile-name>Loading account...</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant" data-profile-role></p>
</div>
</div>
<dl class="divide-y divide-border-subtle">
<div class="py-4">
<dt class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">Email</dt>
<dd class="mt-1 text-on-surface" data-profile-email></dd>
</div>
<div class="py-4">
<dt class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant" data-profile-context-label>Account</dt>
<dd class="mt-1 text-on-surface" data-profile-context>SideQuest member</dd>
</div>
</dl>
<a class="inline-flex items-center gap-2 mt-5 px-4 py-2.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md" href="#" data-account-home>
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
Return to dashboard
</a>
</section>
<aside class="rounded-xl border border-border-subtle bg-surface-container-lowest p-6 shadow-sm h-fit">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Appearance</h2>
<label class="flex items-center justify-between gap-4 mt-5 cursor-pointer">
<span>
<span class="block font-label-md text-label-md text-on-surface">Dark mode</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant" data-theme-label>Dark mode is off</span>
</span>
<input class="h-5 w-5 rounded border-border-subtle text-primary" data-theme-toggle type="checkbox">
</label>
<div class="border-t border-border-subtle mt-6 pt-6">
<button class="w-full flex items-center justify-center gap-2 border border-error/40 text-error px-4 py-2.5 rounded-lg font-label-md text-label-md hover:bg-error/10" data-logout type="button">
<span class="material-symbols-outlined text-[18px]">logout</span>
Sign out
</button>
</div>
</aside>
</div>
</main>
<script type="module" src="../assets/js/app.js"></script>
<script type="module" src="../assets/js/pages/account-profile.js"></script>
</body>
</html>
