<!DOCTYPE html>
<html class="light" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><title>Report an Issue | SideQuest</title>
<script>document.documentElement.classList.add("is-loading");try{const d=localStorage.getItem("sidequest-theme")==="dark";document.documentElement.classList.toggle("dark",d);document.documentElement.classList.toggle("light",!d)}catch{}</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"><script type="module" src="../assets/js/config/student-dashboard.tailwind.js"></script><link href="../assets/css/base.css" rel="stylesheet"></head>
<body class="bg-background text-on-surface min-h-screen font-body-md"><header class="h-16 px-6 flex items-center justify-between border-b border-border-subtle bg-surface-container-lowest"><a class="student-shell-brand text-primary" href="student-dashboard.html">SideQuest</a><img alt="User profile avatar" class="student-shell-avatar"></header>
<main class="max-w-4xl mx-auto p-6 md:p-10"><a class="text-primary font-semibold" href="student-dashboard.html">← Back to dashboard</a><div class="mt-7 mb-8"><p class="uppercase tracking-wider text-xs text-on-surface-variant">Safety and support</p><h1 class="text-3xl font-bold mt-2">Report an issue</h1><p class="text-on-surface-variant mt-2">Send an account, quest, payment, or technical concern to SideQuest administrators.</p></div>
<div class="grid lg:grid-cols-[1.1fr_.9fr] gap-6"><form class="bg-surface-container-lowest border border-border-subtle rounded-xl p-6" data-report-form><label class="block font-semibold">Subject<input class="mt-2 w-full rounded-lg border-border-subtle bg-surface" maxlength="120" name="subject" required></label><label class="block font-semibold mt-5">Category<select class="mt-2 w-full rounded-lg border-border-subtle bg-surface" name="category" required><option value="user_conduct">User conduct</option><option value="quest_content">Quest content</option><option value="payment_dispute">External payment dispute</option><option value="technical_issue">Technical issue</option><option value="other">Other</option></select></label><label class="block font-semibold mt-5">What happened?<textarea class="mt-2 w-full rounded-lg border-border-subtle bg-surface" maxlength="2000" minlength="10" name="description" required rows="7"></textarea></label><button class="mt-5 bg-primary text-on-primary px-5 py-3 rounded-lg font-bold disabled:opacity-50" type="submit">Submit report</button><p class="mt-3 text-sm text-on-surface-variant" data-report-status aria-live="polite"></p></form><section class="bg-surface-container-lowest border border-border-subtle rounded-xl p-6"><h2 class="text-xl font-bold">Your reports</h2><div class="mt-5 space-y-3" data-report-history><p>Loading...</p></div></section></div></main>
<script type="module" src="../assets/js/app.js"></script><script type="module" src="../assets/js/pages/report-issue.js"></script></body></html>
